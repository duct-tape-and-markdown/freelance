id: knowledge-compilation
version: "3.1.0"
name: "Knowledge Compilation Session"
description: >
  Orchestrates a Runner compiler session. You are the compiler — you read source
  code, validate existing knowledge, fill gaps, and emit propositions into the
  graph. Every query reads sources. Every query deepens the graph.
startNode: begin-session
strictContext: false

context:
  query: null
  queryIntent: null
  sessionId: null
  manifest: null
  entityList: null
  facetCount: 0
  gapCount: 0
  gapFacets: null
  filesRead: 0
  propositionsEmitted: 0
  coverageSufficient: false
  cycleCount: 0

nodes:
  begin-session:
    type: action
    description: "Start a compiler session and receive the graph manifest"
    instructions: |
      Call compiler_begin_session with the compilation query.

      The server returns:
      - sessionId — use in all subsequent compiler_* calls
      - manifest — what the graph already knows
      - entityList — entities you MUST reuse during construction

      Read the manifest. It's your head start — not your answer.

      Set context.query, context.sessionId, context.manifest, context.entityList.
    suggestedTools:
      - compiler_begin_session
    edges:
      - target: decompose
        label: session-started
        condition: "context.sessionId != null"

  decompose:
    type: action
    description: "Classify query intent and decompose into facets"
    instructions: |
      ## Step 1: Classify the query intent

      Set context.queryIntent to ONE of:

      **implementation** — how code works internally
      Signals: "how does X work", "what does X do", "trace the flow"

      **architecture** — how components relate and why
      Signals: "how does X relate to Y", "what depends on X"

      **procedural** — how to accomplish something
      Signals: "how do I", "how to set up", "steps to"

      **diagnostic** — why something happens or fails
      Signals: "why does X", "what causes", "what happens if"

      ## Step 2: Decompose into facets

      Shape facets by intent:
      - implementation → what code does, how data flows, what calls what
      - architecture → boundaries, dependencies, design patterns
      - procedural → steps, prerequisites, configuration, outcomes
      - diagnostic → conditions, triggers, failure modes, side effects

      Each facet: a concrete, answerable question. Not a category.

      Call compiler_report_facets with sessionId and your facets.
      Set context.facetCount.
    suggestedTools:
      - compiler_report_facets
    edges:
      - target: assess-coverage
        label: facets-reported

  assess-coverage:
    type: action
    description: "Review existing knowledge and identify what to validate"
    instructions: |
      Review the propositions retrieved for each facet.

      For each facet, classify what the graph already has:
      - "covered" — useful answer at the right abstraction level for the intent
      - "partial" — topic touched but wrong vocabulary level, or significant gaps
      - "gap" — irrelevant or absent

      A facet answered with implementation-level detail when the intent is
      procedural is "partial" — the topic exists but the framing doesn't
      serve the audience.

      Call compiler_report_coverage with sessionId and your assessments.

      Note which facets have existing coverage — you'll validate those against
      sources during exploration. Note which are gaps — you'll fill those.

      Set context.gapCount and context.gapFacets (include partial facets).
    suggestedTools:
      - compiler_report_coverage
    edges:
      - target: explore
        label: coverage-assessed

  explore:
    type: action
    maxTurns: 20
    description: "Read source code to validate and deepen knowledge"
    instructions: |
      Budget: 3-5 source files. grep first, read second.

      You have two jobs:
      1. **Validate** — for facets with existing coverage, read the source to
         confirm the graph's claims are still accurate
      2. **Fill** — for gap/partial facets, read source to extract new knowledge

      ## Source tools (runner — tracked for provenance)
      - compiler_grep_files — find relevant code
      - compiler_search_files — locate files by pattern
      - compiler_read_file — read what matters (tracked for provenance)
      - compiler_list_files — list directory contents

      ## Graph tools (runner)
      - compiler_browse_entities / compiler_inspect_entity — check existing knowledge

      ## Code intelligence (connect-lsp — if available)
      Use cross-language tools to discover connections across ASP/C#/SQL:
      - cross_trace — forward trace from a symbol across language boundaries
      - cross_impact — reverse impact (who calls this)
      - cross_chain — full call chain with language transitions
      - asp_*, sql_*, dotnet_* — per-language definition, references, symbols

      These tools reveal connections but don't establish provenance.
      Always compiler_read_file on files you discover through them.

      Depth over breadth. Permission to stop early.

      Increment context.filesRead for each compiler_read_file call.
    suggestedTools:
      - compiler_grep_files
      - compiler_search_files
      - compiler_list_files
      - compiler_read_file
      - compiler_browse_entities
      - compiler_inspect_entity
      - cross_trace
      - cross_impact
      - cross_chain
    edges:
      - target: explore-gate
        label: explored

  explore-gate:
    type: gate
    description: "Verify source files were read"
    instructions: |
      Provenance requires file reads. Propositions without source are ungrounded.
    validations:
      - expr: "context.filesRead > 0"
        message: "Read at least one source file via compiler_read_file."
    edges:
      - target: construct
        label: ready-to-construct

  construct:
    type: action
    maxTurns: 5
    description: "Decompose findings and emit propositions"
    instructions: |
      Call compiler_advance_to_construct with sessionId.

      ## Step 1: Decompose your findings

      Before touching the emission schema, enumerate what you learned as a
      plain list of atomic facts. Apply the Dense X decomposition rules:

      1. Split compound sentences into simple sentences
      2. For any named entity with additional descriptive information,
         separate that into its own proposition
      3. Each fact must be interpretable without the others

      Split when you see:
      - "and" / "also" / "additionally" joining independent facts
      - A sequence of more than 2 steps
      - A cause AND its effect
      - Multiple subjects doing different things

      Keep together when:
      - The parts are meaningless alone
      - Splitting would destroy the relationship

      ## Step 2: Check vocabulary against intent

      context.queryIntent determines vocabulary:

      **implementation** — technical: class names, method signatures, parameters
      **architecture** — component-level: service names, layers, protocols
      **procedural** — product/domain: no class names or method signatures
      **diagnostic** — troubleshooting: conditions, error codes, failure paths

      ## Step 3: Knowledge type awareness

      Source code contains four knowledge types (Revised Bloom's Taxonomy):
      - Factual — concrete values, configuration, specific details
      - Conceptual — relationships, patterns, classifications
      - Procedural — sequences, algorithms, decision criteria
      - Metacognitive — trade-offs, design rationale

      Let the query guide which types you emphasize.

      ## Step 4: Emit

      Call compiler_emit_knowledge with sessionId. Each proposition:
      - content: one atomic fact
      - entities: 1-2 hub concepts (named at the intent's vocabulary level)
      - relationship: category tag
      - confidence: 0-1
      - sourceFiles: only the files THIS fact came from
      - relatedTo: link to related propositions. Two modes:
        { propositionIndex: N, relation } — this batch
        { propositionId: "uuid", relation } — existing graph proposition
        Relations: elaborates, causal, supports, contradicts, derives
        Build onto prior knowledge when inspectEntity reveals related facts.

      ## Anti-patterns — never emit:
      - Inventories, statistics, listings
      - Meta-references ("the file defines...")
      - Organizational summaries ("organized into...")

      ## Entity rules:
      - REUSE entities from context.entityList
      - 3:1+ proposition-to-entity ratio
      - Entity with 1 proposition = dead end

      Update context.propositionsEmitted with the count.
    suggestedTools:
      - compiler_advance_to_construct
      - compiler_emit_knowledge
    edges:
      - target: construct-gate
        label: constructed

  construct-gate:
    type: gate
    description: "Verify propositions were emitted"
    validations:
      - expr: "context.propositionsEmitted > 0"
        message: "Emit at least one proposition."
    edges:
      - target: evaluate
        label: ready-to-evaluate

  evaluate:
    type: action
    description: "Evaluate coverage after construction"
    instructions: |
      Call compiler_evaluate with sessionId.

      For each facet, judge with the same two-question test:
      1. Do propositions address the core question?
      2. At the right vocabulary level for the intent?

      Call compiler_report_evaluation with sessionId and assessments.

      Set context.coverageSufficient based on the verdict.
      Set context.gapFacets to remaining gaps.
      Increment context.cycleCount.
    suggestedTools:
      - compiler_evaluate
      - compiler_report_evaluation
    edges:
      - target: cycle-decision
        label: evaluated

  cycle-decision:
    type: decision
    description: "Complete or loop"
    instructions: |
      Sufficient → done. Gaps remain → explore again.
    edges:
      - target: done
        label: sufficient
        condition: "context.coverageSufficient == true"
      - target: explore
        label: more-cycles
        condition: "context.coverageSufficient == false && context.cycleCount < 3"
      - target: done
        label: budget-exhausted
        default: true

  done:
    type: terminal
    description: "Compilation complete — synthesize the answer"
    instructions: |
      The graph now has validated, intent-appropriate propositions for this query.

      Synthesize a complete answer from the graph's propositions. Use runner_query
      to retrieve the final set of relevant propositions, then compose an answer
      at the vocabulary level matching context.queryIntent.

      After the answer, summarize the compilation:
      - Query: context.query
      - Intent: context.queryIntent
      - Facets: context.facetCount
      - Files read: context.filesRead
      - Propositions emitted: context.propositionsEmitted
      - Cycles: context.cycleCount
