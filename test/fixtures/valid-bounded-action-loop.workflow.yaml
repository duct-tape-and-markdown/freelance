id: valid-bounded-action-loop
version: "1.0.0"
name: "Valid Bounded Action Loop"
description: "An action retry loop with a real exit edge — bounded, so it is valid (#340)"
startNode: start

nodes:
  start:
    type: action
    description: "Start node"
    edges:
      - target: step-a
        label: begin

  step-a:
    type: action
    description: "Action A"
    edges:
      - target: step-b
        label: next

  step-b:
    type: action
    description: "Action B — loops back to retry, or exits via finish"
    edges:
      - target: step-a
        label: loop-back
      - target: done
        label: finish

  done:
    type: terminal
    description: "End"
